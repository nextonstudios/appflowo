name: Release Flowo

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Flowo ${{ github.ref_name }}'
          releaseBody: 'Nueva versión de Flowo'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  update-gist:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Wait for release assets
        run: sleep 30

      - name: Download signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          
          WIN_SIG=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "${BASE}/Flowo_${VERSION}_x64-setup.exe.sig")
          MAC_ARM_SIG=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "${BASE}/Flowo_${VERSION}_aarch64.dmg.sig")
          LINUX_SIG=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "${BASE}/Flowo_${VERSION}_amd64.AppImage.sig")
          
          echo "WIN_SIG=${WIN_SIG}" >> $GITHUB_ENV
          echo "MAC_ARM_SIG=${MAC_ARM_SIG}" >> $GITHUB_ENV
          echo "LINUX_SIG=${LINUX_SIG}" >> $GITHUB_ENV

      - name: Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          CONTENT=$(cat <<EOF
          {
            "version": "${VERSION}",
            "notes": "Flowo v${VERSION}",
            "pub_date": "${DATE}",
            "platforms": {
              "windows-x86_64": {
                "url": "${BASE}/Flowo_${VERSION}_x64-setup.exe",
                "signature": "${WIN_SIG}"
              },
              "darwin-aarch64": {
                "url": "${BASE}/Flowo_${VERSION}_aarch64.dmg",
                "signature": "${MAC_ARM_SIG}"
              },
              "linux-x86_64": {
                "url": "${BASE}/Flowo_${VERSION}_amd64.AppImage",
                "signature": "${LINUX_SIG}"
              }
            }
          }
          EOF
          )
          
          curl -s -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"files\":{\"gistfile1.txt\":{\"content\":$(echo $CONTENT | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}}}" \
            "https://api.github.com/gists/f40304340ffbfe1411d22db21d135d9c"